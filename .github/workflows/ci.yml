name: CI

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'Screenshots/**'
      - '.idea/**'
      - 'LICENSE'
      - 'SCOPE'
      - 'SUMMARY'
      - 'SOURCE_URL'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'Screenshots/**'
      - '.idea/**'
      - 'LICENSE'
      - 'SCOPE'
      - 'SUMMARY'
      - 'SOURCE_URL'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests and Android Lint
        run: ./gradlew testDebugUnitTest lintDebug

      - name: Upload Test and Lint Reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-reports
          retention-days: 14
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

  build:
    name: Build & Upload
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          fi

      - name: Write key
        run: |
          if [ ! -z "${{ secrets.KEYSTORE }}" ]; then
            {
              echo KEYSTORE_PASSWORD='${{ secrets.KEYSTORE_PASSWORD }}'
              echo KEY_ALIAS='${{ secrets.KEY_ALIAS }}'
              echo KEY_PASSWORD='${{ secrets.KEY_PASSWORD }}'
              echo KEYSTORE_FILE="$GITHUB_WORKSPACE/key.jks"
            } >> gradle.properties
            echo "${{ secrets.KEYSTORE }}" | base64 -d > key.jks
          fi

      - name: Assemble Debug and Release APK
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload Release APK & ProGuard Mapping
        uses: actions/upload-artifact@v7
        with:
          name: SwiftBackupPrem-${{ github.ref_name }}-release
          retention-days: 14
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: SwiftBackupPrem-${{ github.ref_name }}-debug
          retention-days: 14
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
