name: Check & Update Swift Backup Targets

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct download URL for Swift Backup APK (optional)'
        required: false
        type: string
  repository_dispatch:
    types: [swiftbackup-release]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  check-release:
    name: Check Telegram Channel
    runs-on: ubuntu-latest
    outputs:
      new_version_found: ${{ steps.check.outputs.new_version_found }}
      version_code: ${{ steps.check.outputs.version_code }}
      version_name: ${{ steps.check.outputs.version_name }}
      doc_title: ${{ steps.check.outputs.doc_title }}
      url: ${{ steps.check.outputs.url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            tools/
            app/src/main/java/io/github/s1ddhants1/swiftbackupprem/DexKit.kt
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Check Telegram Channel for New Release
        id: check
        run: |
          chmod +x tools/fetch_telegram_release.py
          python3 tools/fetch_telegram_release.py --check-only

  scan-and-update:
    name: Scan & Update Class Mappings
    needs: check-release
    if: needs.check-release.outputs.new_version_found == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    outputs:
      pr_merged: ${{ steps.auto_merge.outputs.pr_merged }}
      merge_sha: ${{ steps.auto_merge.outputs.merge_sha }}
      pr_number: ${{ steps.cpr.outputs.pull-request-number }}
      doc_title: ${{ steps.release_scanner.outputs.doc_title || needs.check-release.outputs.doc_title }}
      version_code: ${{ steps.release_scanner.outputs.version_code || needs.check-release.outputs.version_code }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install telethon

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permissions for scripts
        run: |
          chmod +x gradlew
          chmod +x tools/scan_swiftbackup.py
          chmod +x tools/fetch_telegram_release.py

      - name: Fetch and Scan Release
        id: release_scanner
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          APK_URL: ${{ inputs.apk_url }}
        run: |
          if [ -n "$APK_URL" ]; then
            echo "[*] Downloading custom APK from $APK_URL..."
            curl -L -o /tmp/swiftbackup_input.apk "$APK_URL"
            python3 tools/scan_swiftbackup.py --apk /tmp/swiftbackup_input.apk --update-code
          else
            echo "[*] Downloading and scanning release from Telegram..."
            python3 tools/fetch_telegram_release.py --update-code
          fi

      - name: Verify Code Compilation & Unit Tests
        run: |
          git status
          if [ -n "$(git status --porcelain app/src/main/java/io/github/s1ddhants1/swiftbackupprem/DexKit.kt)" ]; then
            echo "[*] New mappings detected. Running test suite..."
            ./gradlew test
          else
            echo "::error::No code changes were generated in DexKit.kt. Scan did not update mappings."
            echo "::notice::If Telegram secrets (TG_API_ID, TG_API_HASH, TG_SESSION) are not configured, automated download from Telegram cannot proceed. Add secrets to repository or trigger workflow_dispatch with 'apk_url'."
            exit 1
          fi

      - name: Create Pull Request with New Class Mappings
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ github.ref_name }}
          branch: "auto-update/${{ github.ref_name }}/swiftbackup-${{ steps.release_scanner.outputs.version_code || needs.check-release.outputs.version_code || 'release' }}"
          commit-message: "feat(targets): add class mappings for ${{ steps.release_scanner.outputs.doc_title || needs.check-release.outputs.doc_title || 'new Swift Backup release' }}"
          title: "feat(targets): add class mappings for ${{ steps.release_scanner.outputs.doc_title || needs.check-release.outputs.doc_title || 'new Swift Backup release' }}"
          body: |
            ### Automated Target Class Scanner Update
            
            This pull request was automatically triggered because a new unmapped release was detected:
            
            - **Target Branch**: `${{ github.ref_name }}`
            - **Release**: `${{ steps.release_scanner.outputs.doc_title || needs.check-release.outputs.doc_title }}`
            - **Version Code**: `${{ steps.release_scanner.outputs.version_code || needs.check-release.outputs.version_code }}`
            - **Telegram URL**: ${{ needs.check-release.outputs.url || 'N/A (custom APK)' }}
            
            #### Automated Verification:
            - Scanned multi-DEX classes with [tools/scan_swiftbackup.py](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/tools/scan_swiftbackup.py).
            - Injected new `VersionClasses` mapping in `DexKit.kt`.
            - Added regression test assertions in `DexKitVersionMapTest.kt`.
            - Ran `./gradlew test` — all unit tests passed cleanly.
          delete-branch: true
          labels: |
            automated-pr
            targets

      - name: Auto-merge Pull Request
        id: auto_merge
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ steps.cpr.outputs.pull-request-number }}"
          echo "[*] Auto-merging pull request #$PR_NUM into ${{ github.ref_name }}..."
          MERGED=false
          for i in {1..5}; do
            if gh pr merge "$PR_NUM" --squash --delete-branch 2>/dev/null; then
              MERGED=true
              break
            elif gh pr merge "$PR_NUM" --admin --squash --delete-branch 2>/dev/null; then
              MERGED=true
              break
            elif gh pr merge "$PR_NUM" --merge --delete-branch 2>/dev/null; then
              MERGED=true
              break
            fi
            echo "Waiting for PR #$PR_NUM to become mergeable (attempt $i/5)..."
            sleep 5
          done

          if [ "$MERGED" != "true" ]; then
            echo "::error::Failed to auto-merge PR #$PR_NUM"
            exit 1
          fi

          git fetch origin "${{ github.ref_name }}"
          MERGE_SHA=$(git rev-parse "origin/${{ github.ref_name }}")
          echo "merge_sha=$MERGE_SHA" >> $GITHUB_OUTPUT
          echo "pr_merged=true" >> $GITHUB_OUTPUT

  build-and-prerelease:
    name: Build & Publish Pre-release
    needs: [check-release, scan-and-update]
    if: needs.scan-and-update.outputs.pr_merged == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Merged Code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.scan-and-update.outputs.merge_sha || github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE }}" ]; then
            echo "[*] Configuring production signing keystore..."
            {
              echo KEYSTORE_PASSWORD='${{ secrets.KEYSTORE_PASSWORD }}'
              echo KEY_ALIAS='${{ secrets.KEY_ALIAS }}'
              echo KEY_PASSWORD='${{ secrets.KEY_PASSWORD }}'
              echo KEYSTORE_FILE="$GITHUB_WORKSPACE/key.jks"
            } >> gradle.properties
            echo "${{ secrets.KEYSTORE }}" | base64 -d > key.jks
          else
            echo "[*] Generating fallback signing keystore..."
            keytool -genkeypair -v \
              -keystore "$GITHUB_WORKSPACE/key.jks" \
              -storepass android \
              -alias swiftbackupprem \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=SwiftBackupPrem Nightly,O=SwiftBackupPrem,C=US"
            {
              echo KEYSTORE_PASSWORD='android'
              echo KEY_ALIAS='swiftbackupprem'
              echo KEY_PASSWORD='android'
              echo KEYSTORE_FILE="$GITHUB_WORKSPACE/key.jks"
            } >> gradle.properties
          fi

      - name: Build Release APKs
        run: ./gradlew --console=plain assembleAllRelease --warning-mode summary

      - name: Prepare Release APKs
        run: |
          OUTPUT_DIR="app/build/outputs/apk/release"
          mkdir -p "$OUTPUT_DIR/out"

          NORMAL_APK=$(find "$OUTPUT_DIR" -maxdepth 1 -name "*.apk" ! -name "*legacy*" | head -n 1)
          LEGACY_APK=$(find "$OUTPUT_DIR" -maxdepth 1 -name "*legacy*.apk" | head -n 1)

          if [ -n "$NORMAL_APK" ] && [ -f "$NORMAL_APK" ]; then
            cp "$NORMAL_APK" "$OUTPUT_DIR/out/SwiftBackupPrem-Nightly.apk"
          else
            echo "::error::Normal release APK not found in $OUTPUT_DIR"
            exit 1
          fi

          if [ -n "$LEGACY_APK" ] && [ -f "$LEGACY_APK" ]; then
            cp "$LEGACY_APK" "$OUTPUT_DIR/out/SwiftBackupPrem-Legacy-Nightly.apk"
          else
            echo "::error::Legacy release APK not found in $OUTPUT_DIR"
            exit 1
          fi

          ls -la "$OUTPUT_DIR/out/"

      - name: Verify APK Signatures
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          echo "Verifying APK signatures using $APKSIGNER"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/out/SwiftBackupPrem-Nightly.apk
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/out/SwiftBackupPrem-Legacy-Nightly.apk
          echo "[*] Certificate fingerprints:"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/out/SwiftBackupPrem-Nightly.apk | grep -i "SHA-256" | head -n 2

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: SwiftBackupPrem-nightly
          path: app/build/outputs/apk/release/out/*
          retention-days: 14

      - name: Publish Nightly Pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TARGET_SHA="${{ needs.scan-and-update.outputs.merge_sha || github.sha }}"
          DOC_TITLE="${{ needs.scan-and-update.outputs.doc_title }}"
          VERSION_CODE="${{ needs.scan-and-update.outputs.version_code }}"
          PR_NUM="${{ needs.scan-and-update.outputs.pr_number }}"

          PREVIOUS_NIGHTLY_SHA=$(gh release view nightly --json targetCommitish --jq .targetCommitish 2>/dev/null || true)
          {
            echo "Automated prerelease built from main at commit $TARGET_SHA. It may be unstable."
            if [ -n "$DOC_TITLE" ]; then
              echo
              echo "## Swift Backup Target Update"
              echo "- **Release**: $DOC_TITLE"
              echo "- **Version Code**: $VERSION_CODE"
              if [ -n "$PR_NUM" ]; then
                echo "- **Pull Request**: #$PR_NUM"
              fi
            fi
            if [ -n "$PREVIOUS_NIGHTLY_SHA" ] && [ "$PREVIOUS_NIGHTLY_SHA" != "$TARGET_SHA" ]; then
              echo
              echo "## Changes since previous nightly"
              gh api "repos/$GITHUB_REPOSITORY/compare/$PREVIOUS_NIGHTLY_SHA...$TARGET_SHA" \
                --jq '.commits[] | "* \(.commit.message | split("\n")[0]) (\(.sha[0:7]))"' 2>/dev/null || true
            fi
          } > nightly-notes.md

          if gh release view nightly > /dev/null 2>&1; then
            gh release delete nightly --yes --cleanup-tag
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" > /dev/null 2>&1; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" > /dev/null 2>&1 || true
          fi

          gh release create nightly \
            app/build/outputs/apk/release/out/SwiftBackupPrem-Nightly.apk \
            app/build/outputs/apk/release/out/SwiftBackupPrem-Legacy-Nightly.apk \
            --target "$TARGET_SHA" \
            --title "SwiftBackupPrem Nightly" \
            --notes-file nightly-notes.md \
            --generate-notes \
            --prerelease \
            --latest=false

      - name: Update Release Summary
        run: |
          echo "## Nightly Pre-release Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Commit**: \`${{ needs.scan-and-update.outputs.merge_sha || github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Swift Backup Target**: ${{ needs.scan-and-update.outputs.doc_title }} (code: ${{ needs.scan-and-update.outputs.version_code }})" >> $GITHUB_STEP_SUMMARY
          echo "- **PR Merged**: #${{ needs.scan-and-update.outputs.pr_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Release URL**: https://github.com/${{ github.repository }}/releases/tag/nightly" >> $GITHUB_STEP_SUMMARY
